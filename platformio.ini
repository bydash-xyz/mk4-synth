; PlatformIO Project Configuration File
; Polyphonic Synthesizer: ESP32-S3 Rev 2.0 with Akai MPK Mini MK4
; Targets:
;   - esp32s3_rev2: ESP32-S3-DevKitC-1 (N16R8, USB Host MIDI, BLE SysEx, OLED, PCM5102A)
;   - diag_dac_test: PCM5102A I2S DAC Test Tone (440 Hz Sine)

[platformio]
default_envs = esp32s3_rev2

; -------------------------------------------------------------------------
; Common configuration across microcontroller targets
; -------------------------------------------------------------------------
[common]
build_unflags = -std=gnu++11 -std=gnu++17 -std=gnu++2b
build_flags =
    -std=gnu++20
    -O3
    -ffast-math
    -Ilib/SynthEngine/include
    -Isrc
lib_extra_dirs = lib
monitor_speed = 115200

; -------------------------------------------------------------------------
; Target 1: ESP32-S3 Rev 2.0 (Standalone Synth & Controller Hub for MPK Mini MK4)
; -------------------------------------------------------------------------
[env:esp32s3_rev2]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
board = esp32s3_120_16_8-qio_opi
framework = arduino
build_src_filter = +<*> -<test_dac_main.cpp>
monitor_speed = ${common.monitor_speed}

build_unflags =
    ${common.build_unflags}
    -Os
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    ${common.build_flags}
    -DARDUINO_ARCH_ESP32
    -DESP32S3_REV2
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0

lib_extra_dirs = ${common.lib_extra_dirs}
extra_scripts = pre:tools/patch_ble_midi.py
lib_deps =
    olikraus/U8g2 @ ^2.35.9
    lathoub/BLE-MIDI @ ^2.2
    fortyseveneffects/MIDI Library @ ^5.0.2

; -------------------------------------------------------------------------
; Target 1a: Same firmware plus on-demand profiling (see src/profiling.h). Not for normal use:
;   pio run -e esp32s3_rev2_profile -t upload
;   ~/.local/pipx/venvs/platformio/bin/python tools/serial_capture.py 40 -f PROFILE
; Flash `esp32s3_rev2` again to go back to the normal firmware.
; -------------------------------------------------------------------------
[env:esp32s3_rev2_profile]
extends = env:esp32s3_rev2
build_flags =
    ${env:esp32s3_rev2.build_flags}
    -DSYNTH_PROFILE=1

; -------------------------------------------------------------------------
; Loudness check: plays the PresetLoudnessTest phrase on every factory preset after boot
; (src/loudness_demo.h). Record the DAC output to compare presets on the real hardware.
;   pio run -e esp32s3_rev2_loudness -t upload
; Flash `esp32s3_rev2` again to go back to the normal firmware.
; -------------------------------------------------------------------------
[env:esp32s3_rev2_loudness]
extends = env:esp32s3_rev2
build_flags =
    ${env:esp32s3_rev2.build_flags}
    -DSYNTH_LOUDNESS_DEMO=1

; -------------------------------------------------------------------------
; Target 1b: Diagnostic 02 — PCM5102A I2S DAC Test Tone (440 Hz Sine)
; -------------------------------------------------------------------------
[env:diag_dac_test]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
board = esp32s3_120_16_8-qio_opi
framework = arduino
build_src_filter = -<*> +<test_dac_main.cpp>
monitor_speed = ${common.monitor_speed}
upload_port = /dev/cu.usbmodem*
; Serial goes to UART0 (the COM port the computer uses); native USB is reserved for the MPK
build_unflags =
    ${common.build_unflags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    ${common.build_flags}
    -DARDUINO_ARCH_ESP32
    -DESP32S3_REV2
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
