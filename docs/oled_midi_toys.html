<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OLED MIDI Toys</title>
<!--
  Playable prototype of MIDI-reactive OLED animations in the spirit of Teenage Engineering's
  OP-1 / Pocket Operator screens. Emulates the real 128x64 SSD1306 (yellow header y 0-15,
  blue animation zone y 16-62) at the firmware's 20 FPS, and feeds each animation the same
  data the firmware's AnimationContext carries (8 voice notes + envelopes, BPM, beat phase).

  Each animation class mirrors IAnimation (reset / update(dt, ctx) / render / onBeat) so it
  ports one-to-one to src/animations/*.h. Notes are detected per voice from the envelopes
  (StrikeTracker) rather than onNoteOn, because the firmware delivers only the last note of
  each 50 ms frame to onNoteOn, which would swallow chords.

  Input: Web MIDI (plug the MPK Mini MK4 into the Mac, open in Chrome), the computer keyboard
  (A W S E D F T G Y H U J K ... ; Z / X = octave), or click the keybed (lower = louder).
-->
<style>
  :root {
    --bg: #111317;
    --card: #1b1e25;
    --line: #2b303c;
    --text: #e4e4e7;
    --muted: #9ca3af;
    --orange: #ff5522;
    --yellow: #ffd000;
    --cyan: #00e5ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    display: flex; flex-direction: column; align-items: center;
  }
  h1 { font-size: 1.2rem; letter-spacing: .12em; text-transform: uppercase; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: .8rem; margin-bottom: 20px; text-align: center; }
  .layout { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; max-width: 1100px; width: 100%; }
  .device { background: #0c0e12; border: 3px solid #22252e; border-radius: 16px; padding: 20px; max-width: 100%; }
  canvas { display: block; width: 512px; max-width: 100%; image-rendering: pixelated; border-radius: 4px;
           background: #05070b; box-shadow: 0 0 30px rgba(0,229,255,.08); }
  .bezel { background: #030406; border: 4px solid #14161d; border-radius: 8px; padding: 10px; }
  .keybed { position: relative; height: 96px; margin-top: 16px; user-select: none; touch-action: none; }
  .key { position: absolute; top: 0; border: 1px solid #000; border-radius: 0 0 4px 4px; cursor: pointer; }
  .key.white { background: #d4d4d8; height: 96px; z-index: 1; }
  .key.black { background: #18181b; height: 58px; z-index: 2; }
  .key.on.white { background: var(--orange); }
  .key.on.black { background: #c2410c; }
  .panel { flex: 1; min-width: 300px; max-width: 460px; background: var(--card); border: 1px solid var(--line);
           border-radius: 12px; padding: 18px; }
  .group { margin-bottom: 16px; }
  label, .lbl { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #a1a1aa; margin-bottom: 6px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button { background: #252a33; color: #fff; border: 1px solid #383f4d; border-radius: 6px; padding: 8px 12px;
           font: 600 11px ui-monospace, monospace; text-transform: uppercase; cursor: pointer; }
  button:hover { background: #313743; }
  button.active { background: var(--orange); border-color: #ff7744; }
  input[type=range] { width: 100%; accent-color: var(--orange); }
  .status { font-size: 11px; color: var(--muted); }
  .status b { color: var(--cyan); font-weight: 600; }
  .desc { font-size: 12px; line-height: 1.55; color: #d4d4d8; background: #14161c; border: 1px solid var(--line);
          border-radius: 8px; padding: 12px; }
  .desc h3 { margin: 0 0 6px; font-size: 12px; color: var(--yellow); letter-spacing: .08em; }
  .desc ul { margin: 0; padding-left: 18px; }
  .desc li { margin-bottom: 3px; }
  kbd { background: #252a33; border: 1px solid #383f4d; border-radius: 3px; padding: 0 4px; font-size: 11px; }
</style>
</head>
<body>
<h1>OLED MIDI Toys</h1>
<div class="sub">128&times;64 SSD1306 &bull; 20 FPS like the firmware &bull; MPK Mini MK4 over Web MIDI, computer keys, or click the keybed</div>

<div class="layout">
  <div class="device">
    <div class="bezel"><canvas id="oled" width="512" height="256"></canvas></div>
    <div class="keybed" id="keybed"></div>
    <div class="status" style="margin-top:10px">Keys <kbd>A</kbd>&ndash;<kbd>'</kbd> play, <kbd>Z</kbd>/<kbd>X</kbd> octave, <kbd>&larr;</kbd>/<kbd>&rarr;</kbd> animation, <kbd>Space</kbd> metronome. Click lower on a key to play it louder.</div>
  </div>

  <div class="panel">
    <div class="group">
      <span class="lbl">Animation</span>
      <div class="row" id="animButtons"></div>
    </div>
    <div class="group desc" id="animDesc"></div>
    <div class="group">
      <label for="bpm">Tempo <span id="bpmVal">120</span> BPM</label>
      <input type="range" id="bpm" min="40" max="240" value="120">
    </div>
    <div class="group row">
      <button id="metroBtn">Metronome off</button>
      <button id="fpsBtn" class="active">20 FPS (device)</button>
      <button id="soundBtn" class="active">Sound on</button>
    </div>
    <div class="group">
      <label for="vel">Computer-key velocity <span id="velVal">100</span></label>
      <input type="range" id="vel" min="1" max="127" value="100">
    </div>
    <div class="status" id="midiStatus">MIDI: requesting access&hellip;</div>
  </div>
</div>

<script>
'use strict';
// ============================================================================================
// Framebuffer + drawing (mirrors AnimDraw: everything clips to the blue zone y 16..62)
// ============================================================================================
const W = 128, H = 64, TOP = 16, BOT = 62;
const fb = new Uint8Array(W * H);

function P(x, y, v = 1) {
  x = Math.round(x); y = Math.round(y);
  if (x >= 0 && x < W && y >= TOP && y <= BOT) fb[y * W + x] = v;
}
function PH(x, y) { if (x >= 0 && x < W && y >= 0 && y < TOP) fb[y * W + x] = 1; } // header only
function line(x0, y0, x1, y1, v = 1) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  for (;;) {
    P(x0, y0, v);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}
function hspan(x0, x1, y, v = 1) { for (let x = Math.round(x0); x <= Math.round(x1); x++) P(x, y, v); }
function vspan(x, y0, y1, v = 1) { for (let y = Math.round(y0); y <= Math.round(y1); y++) P(x, y, v); }
function rect(x, y, w, h) { hspan(x, x + w - 1, y); hspan(x, x + w - 1, y + h - 1); vspan(x, y, y + h - 1); vspan(x + w - 1, y, y + h - 1); }
function box(x, y, w, h, v = 1) { for (let j = 0; j < h; j++) hspan(x, x + w - 1, y + j, v); }
function disc(cx, cy, r) {
  for (let dy = -r; dy <= r; dy++) { const h = Math.floor(Math.sqrt(r * r - dy * dy) + 0.5); hspan(cx - h, cx + h, cy + dy); }
}
function ellipseFill(cx, cy, rx, ry, v = 1) {
  for (let dy = -ry; dy <= ry; dy++) {
    const h = Math.round(rx * Math.sqrt(Math.max(0, 1 - (dy * dy) / (ry * ry))));
    hspan(cx - h, cx + h, cy + dy, v);
  }
}
// Midpoint circle outline; every > 1 leaves gaps for a dotted ring
function circle(cx, cy, r, v = 1, every = 1) {
  let x = r, y = 0, err = 1 - r, i = 0;
  while (x >= y) {
    if (i % every === 0) for (const [a, b] of [[x, y], [y, x], [-y, x], [-x, y], [-x, -y], [-y, -x], [y, -x], [x, -y]]) P(cx + a, cy + b, v);
    i++; y++;
    if (err < 0) err += 2 * y + 1; else { x--; err += 2 * (y - x) + 1; }
  }
}
function sprite(x, y, rows, flipX = false, flipY = false) {
  const h = rows.length, w = rows[0].length;
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    if (rows[flipY ? h - 1 - j : j][flipX ? w - 1 - i : i] === '#') P(x + i, y + j);
  }
}

// 3x5 pixel font. Each glyph is five rows of 3 bits, MSB = left column.
const FONT = {
  A:[2,5,7,5,5],B:[6,5,6,5,6],C:[3,4,4,4,3],D:[6,5,5,5,6],E:[7,4,6,4,7],F:[7,4,6,4,4],G:[3,4,5,5,3],
  H:[5,5,7,5,5],I:[7,2,2,2,7],J:[1,1,1,5,2],K:[5,5,6,5,5],L:[4,4,4,4,7],M:[5,7,7,5,5],N:[6,5,5,5,5],
  O:[2,5,5,5,2],P:[6,5,6,4,4],Q:[2,5,5,6,3],R:[6,5,6,5,5],S:[3,4,2,1,6],T:[7,2,2,2,2],U:[5,5,5,5,7],
  V:[5,5,5,5,2],W:[5,5,7,7,5],X:[5,5,2,5,5],Y:[5,5,2,2,2],Z:[7,1,2,4,7],
  '0':[7,5,5,5,7],'1':[2,6,2,2,7],'2':[6,1,2,4,7],'3':[6,1,2,1,6],'4':[5,5,7,1,1],'5':[7,4,6,1,6],
  '6':[3,4,6,5,2],'7':[7,1,2,2,2],'8':[2,5,2,5,2],'9':[2,5,3,1,6],
  '!':[2,2,2,0,2],'?':[6,1,2,0,2],'.':[0,0,0,0,2],':':[0,2,0,2,0],'-':[0,0,7,0,0],'+':[0,2,7,2,0],
  '#':[5,7,5,7,5],' ':[0,0,0,0,0],'/':[1,1,2,4,4],
};
function text(x, y, s, plot = P) {
  for (const ch of s.toUpperCase()) {
    const g = FONT[ch] || FONT['?'];
    for (let r = 0; r < 5; r++) for (let c = 0; c < 3; c++) if (g[r] & (4 >> c)) plot(x + c, y + r);
    x += 4;
  }
}
const textWidth = (s) => s.length * 4 - 1;

// ============================================================================================
// Shared helpers that would live next to AnimDraw in firmware
// ============================================================================================
const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const rand = (lo, hi) => lo + Math.random() * (hi - lo);

// Physical MK4 key (0..24) mapped across the screen, so the keybed spans the full width at any octave.
function noteToX(note, ctx, margin = 6) {
  const k = clamp(note - ctx.keybedNoteOffset - 48, 0, 24) / 24;
  return margin + k * (W - 1 - 2 * margin);
}

// Detects each new note per voice from the envelope snapshot. Fires once when a voice's envelope
// starts rising (attack) or when a sounding voice switches to a different note (steal / legato).
class StrikeTracker {
  constructor() { this.reset(); }
  // The first update after reset() only records the voices, so notes still ringing when an
  // animation is switched to don't register as new strikes.
  reset() { this.prev = new Float32Array(8); this.prevNote = new Uint8Array(8); this.armed = new Array(8).fill(true); this.primed = false; }
  update(ctx) {
    const out = [], report = this.primed;
    this.primed = true;
    for (let v = 0; v < 8; v++) {
      const e = ctx.voiceEnvelopes[v], n = ctx.voiceNotes[v];
      const rising = e > this.prev[v] + 0.001;
      const newNote = e > 0.01 && n !== this.prevNote[v] && this.prev[v] > 0.01;
      if ((rising && this.armed[v]) || newNote) { if (report) out.push(v); this.armed[v] = false; }
      if (e < this.prev[v] - 0.0005 || e < 0.01) this.armed[v] = true;
      this.prev[v] = e;
      if (e > 0.01) this.prevNote[v] = n;
    }
    return out;
  }
}

// ============================================================================================
// 1. CHOIR - one blob singer per synth voice
// ============================================================================================
const NOTE_GLYPH = ['..#.', '..##', '..#.', '###.', '###.'];
class ChoirAnimation {
  name = 'CHOIR';
  desc = `<h3>CHOIR</h3><ul>
    <li>Eight blob singers, one per synth voice. Hold a chord and you see your voicing.</li>
    <li>Mouth opening follows the voice's envelope, so a pad's slow attack shows as a slow yawn and a pluck as a quick "pa".</li>
    <li>Higher notes make the singer stand taller. Velocity sets how high it hops.</li>
    <li>Every note sends a little &#9834; floating up. On the metronome they sway on alternate beats.</li>
    <li>Stay quiet for 6 s and they sag and fall asleep. Play to wake them.</li></ul>`;
  constructor() { this.tracker = new StrikeTracker(); this.reset(); }
  reset() {
    this.tracker.reset();
    this.s = Array.from({ length: 8 }, () => ({ hop: 0, vy: 0, stretch: 0, mouth: 0, blink: rand(1, 4), surprise: 0, arms: 0 }));
    this.notes = []; this.zs = []; this.quiet = 0; this.zTimer = 0;
  }
  slotX(v) { return 8 + v * 16; }
  update(dt, ctx) {
    for (const v of this.tracker.update(ctx)) {
      const s = this.s[v];
      s.vy = -(70 + 90 * ctx.lastVelocity / 127);
      s.surprise = 0.2;
      if (this.notes.length < 12) this.notes.push({ x: this.slotX(v) + 4, y: 60 - 14 - s.stretch, t: rand(0, 6) });
    }
    let any = false;
    for (let v = 0; v < 8; v++) {
      const s = this.s[v], env = ctx.voiceEnvelopes[v];
      const singing = env > 0.02;
      any = any || singing;
      const target = singing ? clamp((ctx.voiceNotes[v] - 36) / 48, 0, 1) * 10 : (this.quiet > 6 ? -3 : 0);
      s.stretch += (target - s.stretch) * Math.min(1, dt * 12);
      s.mouth += (env - s.mouth) * Math.min(1, dt * 20);
      s.arms += ((env > 0.55 ? 1 : 0) - s.arms) * Math.min(1, dt * 10);
      s.hop += s.vy * dt; s.vy += 520 * dt;
      if (s.hop > 0) { s.hop = 0; s.vy = 0; }
      s.surprise = Math.max(0, s.surprise - dt);
      s.blink -= dt; if (s.blink < -0.12) s.blink = rand(2, 5);
    }
    this.quiet = any ? 0 : this.quiet + dt;
    for (const n of this.notes) { n.y -= 14 * dt; n.t += dt; }
    this.notes = this.notes.filter(n => n.y > 10);
    if (this.quiet > 6) {
      this.zTimer -= dt;
      if (this.zTimer <= 0) { this.zTimer = 1.3; this.zs.push({ x: this.slotX(Math.floor(rand(0, 8))) + 4, y: 44, t: 0 }); }
    }
    for (const z of this.zs) { z.y -= 8 * dt; z.t += dt; }
    this.zs = this.zs.filter(z => z.y > 12 && this.quiet > 6);
  }
  render(ctx) {
    hspan(0, 127, 62);
    const sway = ctx.metronomeOn && ctx.activeVoiceCount > 0 ? (ctx.currentBeat % 2 ? 1 : -1) : 0;
    for (let v = 0; v < 8; v++) {
      const s = this.s[v], singing = ctx.voiceEnvelopes[v] > 0.02;
      const cx = this.slotX(v) + (singing ? sway : 0);
      const bh = Math.round(14 + s.stretch);
      const bot = 59 + Math.round(s.hop), top = bot - bh + 1;
      // Bean body with clipped corners
      hspan(cx - 4, cx + 3, top); hspan(cx - 4, cx + 3, bot);
      P(cx - 5, top + 1); P(cx + 4, top + 1); P(cx - 5, bot - 1); P(cx + 4, bot - 1);
      vspan(cx - 6, top + 2, bot - 2); vspan(cx + 5, top + 2, bot - 2);
      // Feet stay on the floor unless hopping
      vspan(cx - 3, bot + 1, bot + 2); vspan(cx + 2, bot + 1, bot + 2);
      // Arms: down at rest, up when belting
      const ay = top + Math.round(bh * 0.55);
      if (s.arms > 0.5) { line(cx - 7, ay, cx - 9, ay - 3); line(cx + 6, ay, cx + 8, ay - 3); }
      else { line(cx - 7, ay, cx - 8, ay + 2); line(cx + 6, ay, cx + 7, ay + 2); }
      // Eyes
      const ey = top + 4;
      const asleep = this.quiet > 6, blinking = s.blink < 0;
      if (asleep || blinking) { hspan(cx - 4, cx - 3, ey + 1); hspan(cx + 2, cx + 3, ey + 1); }
      else if (s.surprise > 0) { box(cx - 4, ey, 2, 2); box(cx + 2, ey, 2, 2); }
      else { vspan(cx - 3, ey, ey + 1); vspan(cx + 2, ey, ey + 1); }
      // Mouth opens with the envelope
      const room = bot - 2 - (top + 8);
      const ry = Math.min(Math.round(s.mouth * (2 + s.stretch / 3)), Math.floor(room / 2));
      if (singing && ry >= 1) ellipseFill(cx - 0.5, top + 8 + ry, 2, ry);
      else hspan(cx - 2, cx + 1, top + 9);
    }
    for (const n of this.notes) sprite(n.x + Math.round(Math.sin(n.t * 5)), n.y, NOTE_GLYPH);
    for (const z of this.zs) text(z.x + Math.round(z.t * 3), z.y, 'z');
  }
  onBeat() {}
}

// ============================================================================================
// 2. POND - a jelly-water surface you poke with notes, and a duck that rides the waves
// ============================================================================================
// 13x10, facing right. duck.x is the duck's centre column, duck.y its top row.
const DUCK_BODY = ['#......####..', '##....#####..', '###########..', '###########..', '.#########...', '..#######....'];
const DUCK = ['........###..', '.......#####.', '.......##.##.', '.......######', ...DUCK_BODY];
const DUCK_QUACK = ['........###..', '.......#####.', '.......##.###', '.......###...', '#......######', ...DUCK_BODY.slice(1)];
const DUCK_SLEEP = ['........###..', '.......#####.', '.......#####.', '.......######', ...DUCK_BODY];
const DUCK_HALF_W = 6, DUCK_H = 10;
class PondAnimation {
  name = 'POND';
  desc = `<h3>POND</h3><ul>
    <li>The water surface is a spring mesh. Each key pokes it at its own spot across the screen (low keys left, high keys right), harder with velocity, and throws up droplets.</li>
    <li>Held notes keep shimmering at their spot, faster for higher notes, so a held chord makes standing ripples.</li>
    <li>The duck paddles toward wherever you last played and rides the waves. A loud note right under it launches it, and the hardest hits make it backflip.</li>
    <li>On the metronome it quacks on every downbeat. Leave it quiet and it dozes off.</li></ul>`;
  static N = 65; static REST = 46;
  constructor() { this.tracker = new StrikeTracker(); this.reset(); }
  reset() {
    this.tracker.reset();
    this.h = new Float32Array(PondAnimation.N); this.v = new Float32Array(PondAnimation.N);
    this.drops = []; this.t = 0; this.quiet = 0; this.quack = 0; this.zTimer = 0; this.zs = [];
    this.duck = { x: 64, y: PondAnimation.REST - (DUCK_H - 1), vy: 0, air: false, flip: false, airT: 0, target: 64, dir: 1, bang: 0 };
  }
  surfaceAt(x) {
    const f = clamp(x / 2, 0, PondAnimation.N - 1.001), i = Math.floor(f), a = f - i;
    return PondAnimation.REST + this.h[i] * (1 - a) + this.h[i + 1] * a;
  }
  poke(x, impulse) {
    const i = Math.round(clamp(x / 2, 1, PondAnimation.N - 2));
    this.v[i] += impulse; this.v[i - 1] += impulse * 0.6; this.v[i + 1] += impulse * 0.6;
  }
  update(dt, ctx) {
    this.t += dt;
    for (const vIdx of this.tracker.update(ctx)) {
      const x = noteToX(ctx.voiceNotes[vIdx], ctx), vel = ctx.lastVelocity / 127;
      this.poke(x, 60 + 140 * vel);
      const n = 2 + Math.round(vel * 4);
      for (let k = 0; k < n && this.drops.length < 30; k++) {
        this.drops.push({ x, y: this.surfaceAt(x) - 1, vx: rand(-25, 25), vy: -rand(30, 60 + 50 * vel) });
      }
      // A loud note right under the duck kicks it straight up; the hardest hits make it backflip
      const duck = this.duck;
      if (!duck.air && vel >= 0.55 && Math.abs(x - duck.x) < 12) {
        duck.air = true; duck.vy = -(50 + 90 * vel); duck.flip = vel >= 0.85; duck.airT = 0; duck.bang = 0.5;
      }
      duck.target = x;
      this.quiet = 0;
    }
    // Held voices shimmer at their key position
    for (let v = 0; v < 8; v++) {
      const env = ctx.voiceEnvelopes[v];
      if (env < 0.02) continue;
      const x = noteToX(ctx.voiceNotes[v], ctx), w = 2 * Math.PI * (2 + (ctx.voiceNotes[v] - 36) / 12 * 1.5);
      this.poke(x, Math.sin(this.t * w) * env * 260 * dt);
    }
    if (ctx.activeVoiceCount > 0) this.quiet = 0; else this.quiet += dt;

    // Spring mesh, 6 substeps (stable for K * sub^2 < 1)
    const K = 2500, KR = 6, D = 1.6, N = PondAnimation.N, sub = dt / 6;
    for (let s = 0; s < 6; s++) {
      for (let i = 0; i < N; i++) {
        const l = i > 0 ? this.h[i - 1] : 0, r = i < N - 1 ? this.h[i + 1] : 0;
        this.v[i] += (K * (l + r - 2 * this.h[i]) - KR * this.h[i] - D * this.v[i]) * sub;
      }
      for (let i = 0; i < N; i++) this.h[i] = clamp(this.h[i] + this.v[i] * sub, -14, 14);
    }

    // Droplets fall back and make tiny secondary splashes
    for (const d of this.drops) { d.vy += 240 * dt; d.x += d.vx * dt; d.y += d.vy * dt; }
    this.drops = this.drops.filter(d => {
      if (d.vy > 0 && d.y >= this.surfaceAt(d.x)) { this.poke(d.x, 12); return false; }
      return d.x > -2 && d.x < 130;
    });

    // Duck
    const duck = this.duck;
    if (!duck.air) {
      const dx = duck.target - duck.x;
      if (Math.abs(dx) > 2) { duck.dir = dx > 0 ? 1 : -1; duck.x += duck.dir * 14 * dt; }
      const i = Math.round(clamp(duck.x / 2, 0, N - 1));
      if (this.v[i] < -55) { // surface moving up fast under the duck: launch
        duck.air = true; duck.vy = this.v[i] * 0.9; duck.flip = this.v[i] < -95; duck.airT = 0; duck.bang = 0.5;
      } else {
        duck.y = this.surfaceAt(duck.x) - (DUCK_H - 1);
      }
    } else {
      duck.airT += dt; duck.vy += 260 * dt; duck.y += duck.vy * dt;
      if (duck.vy > 0 && duck.y >= this.surfaceAt(duck.x) - (DUCK_H - 1)) {
        duck.air = false; this.poke(duck.x, duck.vy * 0.5);
      }
    }
    duck.bang = Math.max(0, duck.bang - dt);
    this.quack = Math.max(0, this.quack - dt);
    if (this.quiet > 6) {
      this.zTimer -= dt;
      if (this.zTimer <= 0) { this.zTimer = 1.4; this.zs.push({ x: duck.x + 4, y: duck.y - 4, t: 0 }); }
    }
    for (const z of this.zs) { z.y -= 7 * dt; z.t += dt; }

  }
  render(ctx) {
    const N = PondAnimation.N;
    let px = 0, py = this.surfaceAt(0);
    for (let i = 1; i < N; i++) { const x = i * 2, y = PondAnimation.REST + this.h[i]; line(px, py, x, y); px = x; py = y; }
    // Sparse drifting dots read as water on a 1-bit screen
    const drift = Math.floor(this.t * 4);

      const sy = Math.ceil(this.surfaceAt(x)) + 3;
      for (let y = sy; y <= 61; y += 3) if (((x >> 2) + Math.floor(y / 3) + drift) % 4 === 0) P(x + ((y / 3) & 1) * 2, y);
    }
    for (const d of this.drops) P(d.x, d.y);

    let rows = this.quiet > 6 ? DUCK_SLEEP : this.quack > 0 ? DUCK_QUACK : DUCK;
    let upside = false;
    if (duck.air && duck.flip) { // tumble: upside down through the middle of the jump
      const phase = (duck.airT * 2.8) % 1;

    }
    sprite(Math.round(duck.x) - DUCK_HALF_W, Math.round(duck.y), rows, duck.dir < 0, upside);
    if (duck.bang > 0) text(Math.round(duck.x) - 1, Math.round(duck.y) - 7, '!');
    for (const z of this.zs) text(Math.round(z.x + z.t * 3), Math.round(z.y), 'z');
  }
  onBeat(beat, down) { if (down) this.quack = 0.18; }
}

// ============================================================================================
// 3. PLINKO - a ball machine: notes drop balls through pegs into eight bins
// ============================================================================================
class PlinkoAnimation {
  name = 'PLINKO';
  desc = `<h3>PLINKO</h3><ul>
    <li>Each note drops a ball from a carriage riding the top rail, at that key's position across the screen. Chords drop several at once.</li>
    <li>Loud notes drop heavy balls. Pegs flash when they're hit.</li>
    <li>Balls pile up in eight bins. A full bin rings <i>DING</i> and empties, so repeating a riff fills the same bins like a slot machine.</li>
    <li>The carriage bobs to the metronome.</li></ul>`;
  constructor() {
    this.tracker = new StrikeTracker();
    this.pegs = [];
    [28, 34, 40, 46].forEach((y, r) => { for (let x = 8 + (r % 2) * 6; x < 124; x += 12) this.pegs.push({ x, y, f: 0 }); });
    this.reset();
  }
  reset() {
    this.tracker.reset(); this.balls = []; this.bins = new Array(8).fill(0); this.ding = new Array(8).fill(0);
    this.pipeX = 64; this.pipeTarget = 64; this.puff = 0; this.bob = 0;
    for (const p of this.pegs) p.f = 0;
  }
  update(dt, ctx) {
    for (const v of this.tracker.update(ctx)) {
      const x = noteToX(ctx.voiceNotes[v], ctx, 4);
      const r = ctx.lastVelocity > 90 ? 2 : 1;
      if (this.balls.length < 30) this.balls.push({ x, y: 23, vx: rand(-6, 6), vy: 10, r });
      this.pipeTarget = x; this.puff = 0.1;
    }
    this.pipeX += (this.pipeTarget - this.pipeX) * Math.min(1, dt * 18);
    this.puff = Math.max(0, this.puff - dt);
    this.bob = ctx.metronomeOn ? (ctx.beatPhase < 0.15 ? 1 : 0) : 0;
    for (const p of this.pegs) p.f = Math.max(0, p.f - dt);
    for (let i = 0; i < 8; i++) {
      if (this.ding[i] > 0) { this.ding[i] -= dt; if (this.ding[i] <= 0) this.bins[i] = 0; }
    }
    const sub = dt / 3;
    for (let s = 0; s < 3; s++) {
      for (const b of this.balls) {
        b.vy += 220 * sub; b.x += b.vx * sub; b.y += b.vy * sub;
        for (const p of this.pegs) {
          const dx = b.x - p.x, dy = b.y - p.y, d = Math.hypot(dx, dy), minD = b.r + 1.2;
          if (d < minD && d > 0.001) {
            const nx = dx / d, ny = dy / d;
            b.x = p.x + nx * minD; b.y = p.y + ny * minD;
            const vn = b.vx * nx + b.vy * ny;
            if (vn < 0) { b.vx -= 1.55 * vn * nx; b.vy -= 1.55 * vn * ny; b.vx += rand(-8, 8); p.f = 0.15; }
          }
        }
        // Side walls everywhere, bin dividers below y 50
        let lo = b.r, hi = 127 - b.r;
        if (b.y + b.r > 50) { const bin = clamp(Math.floor(b.x / 16), 0, 7); lo = bin * 16 + 1 + b.r; hi = bin * 16 + 15 - b.r; }
        if (b.x < lo) { b.x = lo; b.vx = Math.abs(b.vx) * 0.5; }
        if (b.x > hi) { b.x = hi; b.vx = -Math.abs(b.vx) * 0.5; }
        const bin = clamp(Math.floor(b.x / 16), 0, 7);
        if (b.y + b.r >= 61 - this.bins[bin] * 2) b.done = bin;
      }
      this.balls = this.balls.filter(b => {
        if (b.done === undefined) return true;
        if (this.ding[b.done] <= 0 && ++this.bins[b.done] >= 5) this.ding[b.done] = 0.45;
        return false;
      });
    }
  }
  render(ctx) {
    // Rail and carriage
    hspan(0, 127, 17);
    const px = Math.round(this.pipeX), py = 18 + this.bob;
    rect(px - 4, py, 9, 4);
    const nz = this.puff > 0 ? 2 : 1;
    hspan(px - nz, px + nz, py + 4);
    for (const p of this.pegs) { if (p.f > 0) { hspan(p.x - 1, p.x + 1, p.y); vspan(p.x, p.y - 1, p.y + 1); } else P(p.x, p.y); }
    for (const b of this.balls) disc(Math.round(b.x), Math.round(b.y), b.r);
    // Bins
    for (let i = 0; i <= 8; i++) vspan(Math.min(i * 16, 127), 50, 62);
    hspan(0, 127, 62);
    for (let i = 0; i < 8; i++) {
      const x0 = i * 16 + 2, x1 = i * 16 + 14;
      if (this.ding[i] > 0) {
        const on = Math.floor(this.ding[i] * 16) % 2 === 0; // flashes
        if (on) box(x0, 51, x1 - x0 + 1, 11);
        text(i * 16 + 8 - Math.floor(textWidth('DING') / 2), 43, 'DING');
      } else {
        for (let k = 0; k < this.bins[i]; k++) hspan(x0, x1, 61 - k * 2);
      }
    }
  }
  onBeat() {}
}

// ============================================================================================
// 4. TYPE - a typewriter that types your melody's contour (and jams on big chords)
// ============================================================================================
const BELL = ['..#..', '.###.', '.###.', '#####'];
class TypewriterAnimation {
  name = 'TYPE';
  desc = `<h3>TYPE</h3><ul>
    <li>The top of a typewriter: a tall sheet of paper on a platen roller (knobs and a carriage-return lever), and a sunburst of little typebar hammers underneath.</li>
    <li>Each key swings its own hammer, low keys from the left and high keys from the right. It flips up on its pivot and stamps a mark on the paper. Higher notes stamp higher on the line, so each line traces your melody.</li>
    <li>Hard hits stamp a solid block, medium ones a hollow box, soft ones a faint dot. Two notes at once stack in one column.</li>
    <li>Three or more notes at once <b>jam</b> the hammers: their heads tangle at the paper and nothing gets typed.</li>
    <li>A short pause types a space. Near the margin the bell shakes, and a full line or a 3 s pause throws the carriage back and feeds the paper up.</li></ul>`;
  static COLS = 22; static BARS = 13; static SX = 64; static STRIKE_Y = 44; static LINE_BOTTOM = 43;
  static SWING = 0.16;
  constructor() { this.tracker = new StrikeTracker(); this.reset(); }
  reset() {
    this.tracker.reset(); this.lines = []; this.cur = []; this.col = 0; this.shownCol = 0; this.feed = 0;
    this.bars = []; this.jam = 0; this.jamBars = []; this.ding = 0; this.silence = 0; this.spaced = true;
    this.t = 0; this.returning = false;
  }
  keyOf(note, ctx) { return clamp(note - ctx.keybedNoteOffset - 48, 0, 24); }
  barFor(key) { return Math.round(key / 24 * (TypewriterAnimation.BARS - 1)); }
  // Hammer i: a short arm standing on a pivot along the bottom edge, leaning a little toward the
  // middle, with its head on a gentle arc (higher in the middle) - a row of little hammers
  hammer(i) {
    const px = 16 + i * 8, py = 62, off = Math.abs(px - 64) / 48;
    return { px, py, hx: px + (64 - px) * 0.2, hy: py - 8 - Math.round((1 - off) * 3) };
  }
  carriageReturn() {
    this.lines.unshift(this.cur); this.lines.length = Math.min(this.lines.length, 2);
    this.cur = []; this.col = 0; this.returning = true; this.feed = 12; this.spaced = true;
  }
  advance(cell) {
    this.cur.push(cell); this.col++;
    if (this.col === TypewriterAnimation.COLS - 4) this.ding = 0.6;
    if (this.col >= TypewriterAnimation.COLS) this.carriageReturn();
  }
  update(dt, ctx) {
    this.t += dt;
    const st = this.tracker.update(ctx);
    this.jam = Math.max(0, this.jam - dt);
    if (st.length >= 3 && this.jam <= 0) {
      this.jam = 0.8; this.jamBars = st.map(v => this.barFor(this.keyOf(ctx.voiceNotes[v], ctx)));
    } else if (st.length && this.jam <= 0) {
      for (const v of st) this.bars.push({ i: this.barFor(this.keyOf(ctx.voiceNotes[v], ctx)), t: 0 });
      const ink = ctx.lastVelocity >= 100 ? 2 : ctx.lastVelocity >= 45 ? 1 : 0;
      this.advance({ rises: st.map(v => Math.round(this.keyOf(ctx.voiceNotes[v], ctx) / 24 * 8)), ink });
      this.spaced = false;
    }
    if (st.length) this.silence = 0;
    else {
      this.silence += dt;
      if (this.silence > 0.6 && !this.spaced && this.col > 0) { this.spaced = true; this.advance(null); }
      if (this.silence > 3 && this.col > 0) this.carriageReturn();
    }
    for (const b of this.bars) b.t += dt;
    this.bars = this.bars.filter(b => b.t < TypewriterAnimation.SWING);
    const rate = this.returning ? 7 : 30;
    this.shownCol += (this.col - this.shownCol) * Math.min(1, dt * rate);
    if (this.returning && Math.abs(this.col - this.shownCol) < 0.1) this.returning = false;
    this.feed *= Math.exp(-dt * 12);
    this.ding = Math.max(0, this.ding - dt);
  }
  // A line is 11 px tall: the mark's top sits 0..8 px above the line's bottom by pitch.
  drawCells(cells, x0, bottom) {
    cells.forEach((c, i) => {
      if (!c) return;
      const x = x0 + i * 4;
      for (const r of c.rises) {
        const y = bottom - 2 - r;
        if (c.ink === 2) box(x, y, 3, 3);
        else if (c.ink === 1) rect(x, y, 3, 3);
        else P(x + 1, y + 1);
      }
    });
  }
  render(ctx) {
    const { SX, STRIKE_Y, LINE_BOTTOM, COLS, BARS, SWING } = TypewriterAnimation;
    // Paper and typed marks, sliding with the carriage
    const paperX = Math.round(SX - this.shownCol * 4);
    const bottom = LINE_BOTTOM + Math.round(this.feed);
    const left = paperX - 6, right = paperX + COLS * 4 + 4;
    vspan(left, 16, 44); vspan(right, 16, 44);
    this.drawCells(this.cur, paperX, bottom);
    this.lines.forEach((l, k) => this.drawCells(l, paperX, bottom - 12 * (k + 1)));
    if (this.silence > 0.6 && Math.floor(this.t * 2) % 2 === 0) hspan(SX, SX + 2, STRIKE_Y);
    // Platen roller with knobs, and the carriage-return lever on the left
    hspan(left - 4, right + 4, 45); hspan(left - 4, right + 4, 48);
    vspan(left - 4, 45, 48); vspan(right + 4, 45, 48);
    box(left - 8, 45, 3, 4); box(right + 6, 45, 3, 4);
    line(left - 8, 44, left - 13, 39); box(left - 15, 38, 3, 2);
    // Hammers: an arm from the pivot to a 3x2 head. A struck one flips up on its pivot until its
    // head hits the strike point; jammed heads pile up there.
    for (let i = 0; i < BARS; i++) {
      const h = this.hammer(i);
      let f = 0, tx = SX, ty = STRIKE_Y + 1;
      const b = this.bars.find(b => b.i === i);
      if (b) f = Math.sin(Math.PI * b.t / SWING);
      if (this.jam > 0 && this.jamBars.includes(i)) { f = 0.9; tx += (i - BARS / 2) * 0.8; ty += (i % 3); }
      const a0 = Math.atan2(h.hy - h.py, h.hx - h.px), l0 = Math.hypot(h.hx - h.px, h.hy - h.py);
      let a1 = Math.atan2(ty - h.py, tx - h.px);
      while (a1 - a0 > Math.PI) a1 -= 2 * Math.PI;
      while (a0 - a1 > Math.PI) a1 += 2 * Math.PI;
      const a = a0 + (a1 - a0) * f, l = l0 + (Math.hypot(tx - h.px, ty - h.py) - l0) * f;
      const hx = h.px + Math.cos(a) * l, hy = h.py + Math.sin(a) * l;
      line(h.px, h.py, hx, hy);
      box(Math.round(hx) - 1, Math.round(hy) - 1, 3, 2);
    }
    // Bell in the corner, shaking when it dings
    const shake = this.ding > 0 ? (Math.floor(this.ding * 30) % 2 ? 1 : -1) : 0;
    sprite(116 + shake, 52, BELL);
    if (this.ding > 0) { P(114, 51); P(122, 51); P(113, 53); P(123, 53); }
  }
  onBeat() {}
}

// ============================================================================================
// 5. KNIT - a knitting machine that knits what you play into a scrolling sweater pattern
// ============================================================================================
class KnitAnimation {
  name = 'KNIT';
  desc = `<h3>KNIT</h3><ul>
    <li>A knitting-machine carriage sweeps the needle bed, two rows per beat, back and forth. It follows the metronome, or free-runs at the set BPM.</li>
    <li>Each column is a key across the screen. Held notes knit V stitches in their column, wider when louder. Every new note leaves a solid knot.</li>
    <li>The fabric scrolls down as it's knitted, so your playing becomes a sweater pattern. A held chord makes stripes, arpeggios make diagonals, trills make zig-zags.</li>
    <li>After 4 s of silence the carriage parks. The next note starts it again.</li></ul>`;
  static COLS = 32; static TOPY = 26; static ROWH = 3; static MAXROWS = 12;
  constructor() { this.tracker = new StrikeTracker(); this.reset(); }
  reset() {
    this.tracker.reset(); this.rows = []; this.curRow = new Uint8Array(32); this.pending = new Uint8Array(32);
    this.freeBeat = 0; this.lastIdx = null; this.done = 0; this.quiet = 99; this.parked = true; this.carX = 0; this.dir = 1;
    this.heldCols = new Uint8Array(32);
  }
  colFor(note, ctx) { return clamp(Math.round(noteToX(note, ctx, 2) / 4), 0, 31); }
  commit() {
    if (this.curRow.some(v => v)) { this.rows.unshift(this.curRow); this.rows.length = Math.min(this.rows.length, KnitAnimation.MAXROWS); }
    else if (this.rows.length) { this.rows.unshift(this.curRow); this.rows.length = Math.min(this.rows.length, KnitAnimation.MAXROWS); }
    this.curRow = new Uint8Array(32); this.dir = -this.dir; this.done = 0;
  }
  update(dt, ctx) {
    for (const v of this.tracker.update(ctx)) { this.pending[this.colFor(ctx.voiceNotes[v], ctx)] = 2; this.quiet = 0; }
    if (ctx.activeVoiceCount > 0) this.quiet = 0; else this.quiet += dt;
    this.heldCols.fill(0);
    for (let v = 0; v < 8; v++) {
      const env = ctx.voiceEnvelopes[v];
      if (env < 0.05) continue;
      const c = this.colFor(ctx.voiceNotes[v], ctx), w = Math.floor(env * 1.6);
      for (let k = c - w; k <= c + w; k++) if (k >= 0 && k < 32) this.heldCols[k] = 1;
    }
    this.freeBeat += ctx.bpm / 60 * dt;
    const rowPos = (ctx.metronomeOn ? ctx.currentBeat + ctx.beatPhase : this.freeBeat) * 2;
    const idx = Math.floor(rowPos), p = rowPos - idx;
    if (this.quiet > 4) {
      if (!this.parked) { this.commit(); this.parked = true; }
      this.lastIdx = idx; return;
    }
    if (this.parked) { this.parked = false; this.lastIdx = idx; this.done = 0; }
    if (idx !== this.lastIdx) { this.knitTo(32); this.commit(); this.lastIdx = idx; }
    this.knitTo(Math.floor(p * 32));
    this.carX = this.dir > 0 ? p * 127 : 127 - p * 127;
  }
  knitTo(n) {
    for (; this.done < n; this.done++) {
      const c = this.dir > 0 ? this.done : 31 - this.done;
      this.curRow[c] = this.pending[c] ? 2 : this.heldCols[c];
      this.pending[c] = 0;
    }
  }
  stitch(x, y, v, odd) {
    if (v === 2) box(x, y, 3, 2);
    else if (v === 1) { P(x, y); P(x + 2, y); P(x + 1, y + 1); }
    else if (odd) P(x + 1, y + 1);
  }
  render(ctx) {
    const { TOPY, ROWH } = KnitAnimation;
    hspan(0, 127, 23);
    for (let c = 0; c < 32; c++) P(c * 4 + 1, 24);
    const cx = Math.round(this.carX);
    rect(cx - 7, 17, 15, 5); box(cx - 1, 19, 3, 1);
    // Row being knitted, then the finished fabric below it
    for (let k = 0; k < this.done; k++) {
      const c = this.dir > 0 ? k : 31 - k;
      this.stitch(c * 4, TOPY, this.curRow[c], c % 2 === 0);
    }
    this.rows.forEach((row, i) => {
      const y = TOPY + (i + 1) * ROWH;
      if (y + 1 > 62) return;
      for (let c = 0; c < 32; c++) this.stitch(c * 4, y, row[c], (c + i) % 2 === 1);
    });
    if (this.parked) text(2, 17, 'PARK');
  }
  onBeat() {}
}

// ============================================================================================
// 6. WASH - a row of three washing machines; each third of the keybed loads its own machine
// ============================================================================================
const CLOTHES = [
  ['##.', '##.', '###', '.##'],     // sock
  ['#####', '.###.', '.###.'],      // t-shirt
  ['###', '#.#', '#.#'],            // shorts
];
class WashAnimation {
  name = 'WASH';
  desc = `<h3>WASH</h3><ul>
    <li>A laundromat: three washing machines side by side. The keybed is split in thirds, low keys load the left machine, middle the centre, high the right.</li>
    <li>Each note throws a sock, t-shirt or pair of shorts (by note) into its machine, and they tumble as the drums turn a quarter turn per beat.</li>
    <li>Each machine's water level follows how much you're playing in its third. Hard hits rock that machine.</li>
    <li>Hold two or more notes in one third for a second and that machine goes into its spin cycle and shakes. The panel lights chase across all three machines on the beat.</li></ul>`;
  static M = 3; static W = 42; static CY = 44; static R = 9; static MAX_CLOTHES = 5;
  constructor() { this.tracker = new StrikeTracker(); this.reset(); }
  reset() {
    this.tracker.reset(); this.t = 0; this.freeBeat = 0; this.beat = 0;
    this.m = Array.from({ length: WashAnimation.M }, (_, i) => ({ clothes: [], drum: i * 2.1, drumSpeed: 0, spin: 0, spinHold: 0, water: 0, shake: 0 }));
  }
  machineFor(note, ctx) { return Math.min(WashAnimation.M - 1, Math.floor(noteToX(note, ctx, 0) / 128 * WashAnimation.M)); }
  cx(i) { return 1 + i * WashAnimation.W + 20; }
  update(dt, ctx) {
    const { M, CY, R, MAX_CLOTHES } = WashAnimation;
    this.t += dt;
    for (const v of this.tracker.update(ctx)) {
      const i = this.machineFor(ctx.voiceNotes[v], ctx), m = this.m[i];
      m.clothes.push({ x: this.cx(i) + rand(-3, 3), y: CY - 5, vx: rand(-15, 15), vy: 20, kind: ctx.voiceNotes[v] % 3, flip: Math.random() < 0.5, age: 0 });
      if (m.clothes.length > MAX_CLOTHES) m.clothes.shift();
      m.shake = Math.max(m.shake, ctx.lastVelocity / 127);
    }
    const energy = new Array(M).fill(0), held = new Array(M).fill(0);
    for (let v = 0; v < 8; v++) {
      const env = ctx.voiceEnvelopes[v];
      if (env < 0.02) continue;
      const i = this.machineFor(ctx.voiceNotes[v], ctx);
      energy[i] += env; if (env > 0.05) held[i]++;
    }
    this.freeBeat += ctx.bpm / 60 * dt;
    this.beat = ctx.metronomeOn ? ctx.currentBeat : Math.floor(this.freeBeat);
    this.m.forEach((m, i) => {
      const cx = this.cx(i);
      m.spinHold = held[i] >= 2 ? m.spinHold + dt : 0;
      m.spin += ((m.spinHold > 1 ? 1 : 0) - m.spin) * Math.min(1, dt * 2);
      m.drumSpeed = ctx.bpm / 60 * (Math.PI / 2) * (1 + m.spin * 5);
      m.drum += m.drumSpeed * dt;
      m.water += (Math.min(1, energy[i] / 1.5) - m.water) * Math.min(1, dt * 3);
      const maxD = R - 2.5, level = CY + R - m.water * R * 1.2;
      for (const c of m.clothes) {
        c.age += dt;
        c.vy += 300 * (1 - m.spin * 0.7) * dt;
        let dx = c.x - cx, dy = c.y - CY, d = Math.hypot(dx, dy) || 0.001;
        c.vx += dx / d * m.spin * 400 * dt; c.vy += dy / d * m.spin * 400 * dt;   // spin pins clothes to the wall
        if (c.y > level) { c.vx *= 0.94; c.vy *= 0.94; }
        c.x += c.vx * dt; c.y += c.vy * dt;
        dx = c.x - cx; dy = c.y - CY; d = Math.hypot(dx, dy) || 0.001;
        if (d > maxD) {
          const nx = dx / d, ny = dy / d;
          c.x = cx + nx * maxD; c.y = CY + ny * maxD;
          const vr = c.vx * nx + c.vy * ny;
          if (vr > 0) { c.vx -= vr * nx * 1.3; c.vy -= vr * ny * 1.3; }
          // The drum wall drags the clothes along with it
          const tx = -ny, ty = nx, vt = c.vx * tx + c.vy * ty, dv = (m.drumSpeed * R - vt) * 0.5;
          c.vx += dv * tx; c.vy += dv * ty;
        }
      }
      m.clothes = m.clothes.filter(c => c.age < 12);
      m.shake = Math.max(0, m.shake - dt * 3);
    });
  }
  render(ctx) {
    const { W, CY, R, M } = WashAnimation;
    this.m.forEach((m, i) => {
      const ox = Math.round(Math.sin(this.t * 60 + i) * m.shake * 1.5 + Math.sin(this.t * 47 + i * 2) * m.spin * 1.2);
      const x0 = 1 + i * W + ox, cx = this.cx(i) + ox;
      rect(x0, 17, W - 1, 46);
      hspan(x0, x0 + W - 2, 23);
      // Two panel lights per machine; the lit one chases across all machines on the beat
      for (let j = 0; j < 2; j++) ((this.beat % (2 * M)) === i * 2 + j ? box : rect)(x0 + 4 + j * 5, 19, 3, 3);
      circle(x0 + 33, 20, 2); P(x0 + 33 + Math.round(Math.cos(m.drum) * 1.4), 20 + Math.round(Math.sin(m.drum) * 1.4));
      rect(x0 + 4, 25, 10, 3);                       // detergent drawer
      circle(cx, CY, R + 3); circle(cx, CY, R + 1, 1, 2);
      for (let k = 0; k < 3; k++) {
        const a = m.drum + k * Math.PI * 2 / 3;
        line(cx + Math.cos(a) * (R - 1), CY + Math.sin(a) * (R - 1), cx + Math.cos(a) * (R - 3), CY + Math.sin(a) * (R - 3));
      }
      if (m.water > 0.05) {
        const level = CY + R - m.water * R * 1.2;
        for (let x = -R; x <= R; x++) {
          const y = Math.round(level + Math.sin(x * 0.6 + this.t * 8 + i) * (1 + m.spin));
          if (x * x + (y - CY) ** 2 < R * R) P(cx + x, y);
          for (let yy = y + 3; yy < CY + R; yy += 3) if ((x + yy) % 4 === 0 && x * x + (yy - CY) ** 2 < R * R) P(cx + x, yy);
        }
      }
      for (const c of m.clothes) {
        const s = CLOTHES[c.kind];
        sprite(Math.round(c.x) + ox - (s[0].length >> 1), Math.round(c.y) - (s.length >> 1), s, c.flip);
      }
    });
  }
  onBeat() {}
}

// ============================================================================================
// 7. SEISMO - a seismograph: hits are quakes, held notes are tremors, beats are grid lines
// ============================================================================================
class SeismoAnimation {
  name = 'SEISMO';
  desc = `<h3>SEISMO</h3><ul>
    <li>A seismograph pen scribbles on paper scrolling past at a speed set by the tempo, with a grid line on every beat (denser on the downbeat).</li>
    <li>Every note is a quake. The needle kicks and rings down, harder with velocity, and the housing jolts.</li>
    <li>Held notes are tremors: low notes make slow, wide waves, high notes make a fine, fast buzz. A chord sums them into one messy trace.</li>
    <li>The needle swings on a pendulum arm with a weight, like the real instrument.</li></ul>`;
  static PEN_X = 94; static MID = 40;
  constructor() { this.tracker = new StrikeTracker(); this.reset(); }
  reset() {
    this.tracker.reset(); this.hist = new Float32Array(95); this.marks = new Uint8Array(95);
    this.d = 0; this.w = 0; this.tremor = 0; this.phases = new Float32Array(8); this.acc = 0;
    this.freeBeat = 0; this.lastBeat = null; this.pendingMark = 0; this.jolt = 0; this.sign = 1;
  }
  step(h, ctx) {
    const om = 2 * Math.PI * 5, zeta = 0.12, n = Math.max(1, Math.ceil(h / 0.004)), hs = h / n;
    for (let i = 0; i < n; i++) {
      this.w += (-om * om * this.d - 2 * zeta * om * this.w) * hs;
      this.d = clamp(this.d + this.w * hs, -19, 19);
    }
    let tr = 0;
    for (let v = 0; v < 8; v++) {
      const env = ctx.voiceEnvelopes[v];
      if (env < 0.02) continue;
      const k = noteToX(ctx.voiceNotes[v], ctx, 0) / 127;
      this.phases[v] += 2 * Math.PI * (3 + k * 14) * h;
      tr += Math.sin(this.phases[v]) * env * (6 - k * 4);
    }
    this.tremor = tr;
  }
  update(dt, ctx) {
    for (const v of this.tracker.update(ctx)) {
      this.sign = -this.sign;
      this.w += this.sign * (120 + 600 * ctx.lastVelocity / 127);
      this.jolt = 0.25 * ctx.lastVelocity / 127 + 0.05;
    }
    this.freeBeat += ctx.bpm / 60 * dt;
    const beatInt = ctx.metronomeOn ? ctx.currentBeat : Math.floor(this.freeBeat);
    if (beatInt !== this.lastBeat) {
      this.pendingMark = (ctx.metronomeOn ? ctx.isDownbeat : beatInt % 4 === 0) ? 2 : 1;
      this.lastBeat = beatInt;
    }
    const speed = ctx.bpm / 60 * 16;
    this.acc += speed * dt;
    while (this.acc >= 1) {
      this.acc -= 1;
      this.step(1 / speed, ctx);
      this.hist.copyWithin(0, 1); this.hist[94] = this.d + this.tremor;
      this.marks.copyWithin(0, 1); this.marks[94] = this.pendingMark; this.pendingMark = 0;
    }
    this.jolt = Math.max(0, this.jolt - dt);
  }
  render(ctx) {
    const { PEN_X, MID } = SeismoAnimation;
    for (let x = 0; x < 95; x += 2) { P(x, 18); P(x, 61); }
    for (let x = 0; x < 95; x++) {
      const m = this.marks[x];
      if (m) for (let y = 20; y < 61; y += m === 2 ? 2 : 4) P(x, y);
    }
    for (let x = 1; x < 95; x++) line(x - 1, clamp(MID + Math.round(this.hist[x - 1]), 19, 60), x, clamp(MID + Math.round(this.hist[x]), 19, 60));
    const penY = clamp(MID + Math.round(this.d + this.tremor), 19, 60);
    const j = this.jolt > 0 ? (Math.floor(this.jolt * 40) % 2 ? 1 : -1) : 0;
    // Paper roll, pendulum arm with its weight, and the housing
    rect(97, 17, 5, 46); vspan(99, 18, 61);
    line(PEN_X + 1, penY, 118 + j, MID);
    disc(108 + j, Math.round(MID + (penY - MID) * 0.45), 3);
    box(PEN_X - 1, penY - 1, 3, 3);
    rect(113 + j, 17, 15, 46); circle(118 + j, MID, 2);
    line(120 + j, 18, 118 + j, MID - 2);
  }
  onBeat() {}
}

// ============================================================================================
// Context model: an 8-voice ADSR + metronome standing in for SynthEngine
// ============================================================================================
const voices = Array.from({ length: 8 }, () => ({ note: 0, env: 0, stage: 'off', age: 0 }));
let ageCounter = 0;
const ctx = {
  bpm: 120, currentBeat: 0, beatPhase: 0, isDownbeat: true, metronomeOn: false,
  activeVoiceCount: 0, voiceNotes: new Uint8Array(8), voiceEnvelopes: new Float32Array(8),
  lastNote: 60, lastVelocity: 100, lastNoteOnMillis: 0, keybedNoteOffset: 0, masterVolume: 0.8, nowMillis: 0,
};
let beatTime = 0;
const held = new Set();

function noteOn(note, vel) {
  if (vel <= 0) return noteOff(note);
  let v = voices.find(x => x.note === note && x.stage !== 'off');
  if (!v) v = voices.find(x => x.stage === 'off');
  if (!v) v = voices.reduce((a, b) => (a.age < b.age ? a : b));
  v.note = note; v.stage = 'a'; v.age = ++ageCounter;
  ctx.lastNote = note; ctx.lastVelocity = vel;
  ctx.lastNoteOnMillis = Math.max(ctx.lastNoteOnMillis + 1, Math.floor(performance.now()));
  held.add(note); paintKeys();
  audio.on(note, vel);
}
function noteOff(note) {
  for (const v of voices) if (v.note === note && (v.stage === 'a' || v.stage === 'd' || v.stage === 's')) v.stage = 'r';
  held.delete(note); paintKeys();
  audio.off(note);
}
function stepVoices(dt) {
  const S = 0.6;
  for (const v of voices) {
    if (v.stage === 'a') { v.env += dt / 0.012; if (v.env >= 1) { v.env = 1; v.stage = 'd'; } }
    else if (v.stage === 'd') { v.env -= (1 - S) * dt / 0.25; if (v.env <= S) { v.env = S; v.stage = 's'; } }
    else if (v.stage === 'r') { v.env *= Math.exp(-dt / 0.12); if (v.env < 0.002) { v.env = 0; v.stage = 'off'; } }
  }
  ctx.activeVoiceCount = 0;
  voices.forEach((v, i) => {
    const on = v.stage !== 'off';
    ctx.voiceNotes[i] = on ? v.note : 0;
    ctx.voiceEnvelopes[i] = v.env;
    if (on) ctx.activeVoiceCount++;
  });
}

// ============================================================================================
// Header (stands in for OledDisplayUI's yellow zone) and the frame loop
// ============================================================================================
function renderHeader(anim) {
  const name = anim.name;
  const bx = 0, bw = textWidth(name) + 6;
  for (let x = bx; x < bx + bw; x++) { PH(x, 1); PH(x, 11); }
  for (let y = 1; y <= 11; y++) { PH(bx, y); PH(bx + bw - 1, y); }
  text(bx + 3, 4, name, PH);
  text(bw + 6, 4, `${ctx.bpm} BPM`, PH);
  if (ctx.metronomeOn) for (let i = 0; i < 4; i++) {
    const x = bw + 6 + textWidth(`${ctx.bpm} BPM`) + 4 + i * 3;
    PH(x, 9); if (i === ctx.currentBeat) { PH(x, 8); PH(x, 7); }
  }
  for (let v = 0; v < 8; v++) {
    const x = 94 + v * 4, h = Math.round(ctx.voiceEnvelopes[v] * 10);
    for (let y = 11 - h; y <= 11; y++) { PH(x, y); PH(x + 1, y); }
  }
  for (let x = 0; x < W; x += 2) PH(x, 14);
}

const anims = [new ChoirAnimation(), new PondAnimation(), new PlinkoAnimation(), new TypewriterAnimation(), new KnitAnimation(),
               new WashAnimation(), new SeismoAnimation()];
let active = 0;
let deviceRate = true;
let acc = 0, lastT = performance.now(), lastBeat = -1;

function frame(dt) {
  const now = performance.now();
  ctx.nowMillis = Math.floor(now);
  stepVoices(dt);
  if (ctx.metronomeOn) {
    beatTime += ctx.bpm / 60 * dt;
    ctx.currentBeat = Math.floor(beatTime) % 4; ctx.beatPhase = beatTime % 1;
  } else { ctx.beatPhase = 0; }
  ctx.isDownbeat = ctx.currentBeat === 0;
  const anim = anims[active];
  if (ctx.currentBeat !== lastBeat) {
    lastBeat = ctx.currentBeat; anim.onBeat(ctx.currentBeat, ctx.isDownbeat);
    if (ctx.metronomeOn) audio.click(ctx.isDownbeat);
  }
  anim.update(dt, ctx);
  fb.fill(0);
  renderHeader(anim);
  anim.render(ctx);
  blit();
}

const cv = document.getElementById('oled'), g = cv.getContext('2d');
function blit() {
  g.fillStyle = '#05070b'; g.fillRect(0, 0, 512, 256);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const on = fb[y * W + x];
    g.fillStyle = on ? (y < TOP ? '#ffd000' : '#00e5ff') : '#0b1119';
    g.fillRect(x * 4, y * 4, 3, 3);
  }
}

function loop(t) {
  const dt = Math.min(0.1, (t - lastT) / 1000); lastT = t;
  if (deviceRate) {
    acc += dt;
    if (acc >= 0.05) { frame(Math.min(acc, 0.05)); acc = acc % 0.05; }
  } else frame(Math.min(dt, 0.05));
  requestAnimationFrame(loop);
}

// ============================================================================================
// Audio: a tiny triangle poly so the page is playable on its own
// ============================================================================================
const audio = {
  enabled: true, ac: null, live: new Map(),
  ensure() { if (!this.ac) this.ac = new (window.AudioContext || window.webkitAudioContext)(); if (this.ac.state === 'suspended') this.ac.resume(); return this.ac; },
  on(note, vel) {
    if (!this.enabled) return;
    const ac = this.ensure(); this.off(note);
    const o = ac.createOscillator(), gn = ac.createGain();
    o.type = 'triangle'; o.frequency.value = 440 * Math.pow(2, (note - 69) / 12);
    const peak = 0.05 + 0.12 * vel / 127, t = ac.currentTime;
    gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(peak, t + 0.012);
    gn.gain.linearRampToValueAtTime(peak * 0.6, t + 0.26);
    o.connect(gn).connect(ac.destination); o.start();
    this.live.set(note, { o, gn });
  },
  off(note) {
    const v = this.live.get(note); if (!v) return;
    const t = this.ac.currentTime;
    v.gn.gain.cancelScheduledValues(t); v.gn.gain.setValueAtTime(v.gn.gain.value, t);
    v.gn.gain.setTargetAtTime(0, t, 0.12); v.o.stop(t + 0.8);
    this.live.delete(note);
  },
  click(down) {
    if (!this.enabled || !this.ac) return;
    const t = this.ac.currentTime, o = this.ac.createOscillator(), gn = this.ac.createGain();
    o.frequency.value = down ? 1760 : 1320;
    gn.gain.setValueAtTime(0.06, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
    o.connect(gn).connect(this.ac.destination); o.start(t); o.stop(t + 0.05);
  },
};

// ============================================================================================
// UI: animation buttons, controls, on-screen keybed, computer keyboard, Web MIDI
// ============================================================================================
const btnRow = document.getElementById('animButtons');
function selectAnim(i) {
  active = (i + anims.length) % anims.length;
  anims[active].reset();
  [...btnRow.children].forEach((b, j) => b.classList.toggle('active', j === active));
  document.getElementById('animDesc').innerHTML = anims[active].desc;
}
anims.forEach((a, i) => {
  const b = document.createElement('button'); b.textContent = a.name; b.onclick = () => selectAnim(i); btnRow.appendChild(b);
});

const bpmEl = document.getElementById('bpm');
bpmEl.oninput = () => { ctx.bpm = +bpmEl.value; document.getElementById('bpmVal').textContent = ctx.bpm; };
const velEl = document.getElementById('vel');
velEl.oninput = () => { document.getElementById('velVal').textContent = velEl.value; };
const metroBtn = document.getElementById('metroBtn');
function toggleMetro() {
  ctx.metronomeOn = !ctx.metronomeOn; beatTime = 0; ctx.currentBeat = 0; lastBeat = -1;
  metroBtn.textContent = ctx.metronomeOn ? 'Metronome on' : 'Metronome off';
  metroBtn.classList.toggle('active', ctx.metronomeOn);
  if (ctx.metronomeOn && audio.enabled) audio.ensure();
}
metroBtn.onclick = toggleMetro;
const fpsBtn = document.getElementById('fpsBtn');
fpsBtn.onclick = () => { deviceRate = !deviceRate; fpsBtn.textContent = deviceRate ? '20 FPS (device)' : '60 FPS (smooth)'; fpsBtn.classList.toggle('active', deviceRate); };
const soundBtn = document.getElementById('soundBtn');
soundBtn.onclick = () => { audio.enabled = !audio.enabled; soundBtn.textContent = audio.enabled ? 'Sound on' : 'Sound off'; soundBtn.classList.toggle('active', audio.enabled); };

// On-screen 25-key keybed (C3..C5, like the MK4 at its centre octave)
const keybed = document.getElementById('keybed');
const keyEls = new Map();
function buildKeybed() {
  keybed.innerHTML = ''; keyEls.clear();
  const whiteW = 100 / 15;
  let col = 0;
  for (let k = 0; k < 25; k++) {
    const pc = k % 12, black = [1, 3, 6, 8, 10].includes(pc), note = 48 + k;
    const el = document.createElement('div');
    el.className = 'key ' + (black ? 'black' : 'white');
    if (black) { el.style.left = `calc(${col * whiteW}% - ${whiteW * 0.3}%)`; el.style.width = `${whiteW * 0.6}%`; }
    else { el.style.left = `${col * whiteW}%`; el.style.width = `${whiteW}%`; col++; }
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault(); el.setPointerCapture(e.pointerId);
      const r = el.getBoundingClientRect();
      const vel = Math.round(clamp(20 + 107 * (e.clientY - r.top) / r.height, 1, 127));
      noteOn(note, vel);
      const up = () => { noteOff(note); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up); };
      el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    });
    keybed.appendChild(el); keyEls.set(note, el);
  }
}
function paintKeys() { for (const [n, el] of keyEls) el.classList.toggle('on', held.has(n + ctx.keybedNoteOffset)); }

// Computer keyboard: two rows like most DAWs
const KEYMAP = { a: 0, w: 1, s: 2, e: 3, d: 4, f: 5, t: 6, g: 7, y: 8, h: 9, u: 10, j: 11, k: 12, o: 13, l: 14, p: 15, ';': 16, "'": 17 };
let octaveShift = 0;
const keyNotes = new Map();
window.addEventListener('keydown', (e) => {
  if (e.repeat || e.metaKey || e.ctrlKey) return;
  const k = e.key.toLowerCase();
  if (k in KEYMAP) { const n = 48 + octaveShift + KEYMAP[k]; keyNotes.set(k, n); noteOn(n, +velEl.value); e.preventDefault(); }
  else if (k === 'z') { octaveShift = Math.max(-24, octaveShift - 12); ctx.keybedNoteOffset = octaveShift; paintKeys(); }
  else if (k === 'x') { octaveShift = Math.min(24, octaveShift + 12); ctx.keybedNoteOffset = octaveShift; paintKeys(); }
  else if (e.key === 'ArrowRight') selectAnim(active + 1);
  else if (e.key === 'ArrowLeft') selectAnim(active - 1);
  else if (e.key === ' ') { toggleMetro(); e.preventDefault(); }
});
window.addEventListener('keyup', (e) => {
  const k = e.key.toLowerCase();
  if (keyNotes.has(k)) { noteOff(keyNotes.get(k)); keyNotes.delete(k); }
});

// Web MIDI: every input, note on/off only
const midiStatus = document.getElementById('midiStatus');
function bindMidi(access) {
  const names = [];
  for (const input of access.inputs.values()) {
    names.push(input.name);
    input.onmidimessage = (m) => {
      const [st, d1, d2] = m.data, type = st & 0xf0;
      if (type === 0x90) noteOn(d1, d2);
      else if (type === 0x80) noteOff(d1);
    };
  }
  midiStatus.innerHTML = names.length ? `MIDI: <b>${names.join(', ')}</b>` : 'MIDI: no inputs found. Plug in the MK4 and reload.';
}
if (navigator.requestMIDIAccess) {
  navigator.requestMIDIAccess().then((access) => { bindMidi(access); access.onstatechange = () => bindMidi(access); },
    () => { midiStatus.textContent = 'MIDI: access denied. Computer keys and the keybed still work.'; });
} else midiStatus.textContent = 'MIDI: Web MIDI unavailable in this browser (use Chrome). Computer keys and the keybed still work.';

buildKeybed();
selectAnim(0);
requestAnimationFrame(loop);
</script>
</body>
</html>
