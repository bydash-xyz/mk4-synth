name: Release

# Push a tag like v0.1.0 to build the firmware and publish it. Tags with a hyphen (v0.2.0-rc.1)
# become pre-releases. The web flasher at https://bydash.xyz/mk4-synth/ serves the latest full
# release, and any tag at https://bydash.xyz/mk4-synth/?version=<tag>.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO and esptool
        run: pip install platformio "esptool==4.8.1"

      - name: Build firmware
        run: pio run -e mk4-synth

      - name: Package image, manifest and checksums
        run: python3 tools/make_firmware_image.py --version "${GITHUB_REF_NAME}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $prerelease --verify-tag \
            --title "mk4-synth $GITHUB_REF_NAME" --notes-file .github/release-notes.md \
            build/release/mk4-synth.bin build/release/manifest.json build/release/SHA256SUMS \
            THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.md
